name: RISC-V Core Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  simulate:
    name: RTL Simulation & Self-Checking Testbench
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: List Repository Files (Debug)
        run: |
          echo "=== Files in repository ==="
          find . -maxdepth 3 -not -path '*/.*'

      - name: Install Toolchain (Icarus Verilog)
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Compile and Run Simulation
        run: |
          mkdir -p build
          # Find all verilog files in the repository automatically
          VERILOG_FILES=$(find . -name "*.v" -not -path "./build/*")
          echo "Found Verilog source files:"
          echo "$VERILOG_FILES"
          
          # Compile with iverilog
          iverilog -g2012 -o build/riscv_sim.vvp $VERILOG_FILES
          
          # Execute the simulation binary
          vvp build/riscv_sim.vvp | tee simulation.log
          
          # Fail step if explicit errors or fatals are raised
          if grep -q -E "FAIL|ERROR|FATAL" simulation.log; then
            echo "Simulation failed functional checks."
            exit 1
          fi

      - name: Upload Verification Logs as Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-log
          path: simulation.log
